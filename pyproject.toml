[tool.poetry]
name = "exp-lab"
version = "0.1.0"
description = "Experiment orchestrator for tiny transformer labs (A1)"
authors = ["Andrei <andrei@example.com>"]
packages = [{ include = "exp_lab" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
mlflow = ">=2.8"
numpy = ">=1.26"
pandas = ">=2.2"
scikit-learn = ">=1.5"
fastapi = ">=0.115"
uvicorn = ">=0.30"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[tool.poetry.scripts]
exp = "exp_lab.cli:main"

[build-system]
requires = ["poetry-core>=1.8.1"]
build-backend = "poetry.core.masonry.api"
